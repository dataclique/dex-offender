[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace]
members = ["attack", "ctf"]
resolver = "2"

[workspace.package]
edition = "2024"
exclude = [".github/", "**/tests/", "**/contracts/", "**/cache/", "**/out/"]

[workspace.dependencies]
async-trait = "0.1.81"
eyre = "0.6"
rand = "0.8.5"
serde = "1.0.204"
serde_json = "1.0.120"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time"] }
alloy = "2"
alloy-sol-types = "1.7"
litesvm = "0.18"
solana-sdk = "4"
spl-token = "8"
borsh = "1"
reqwest = "0.13"
