[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace]
members = ["attack", "ctf"]
default-members = ["attack"]
resolver = "2"

[workspace.package]
edition = "2024"
exclude = [".github/", "**/tests/", "**/contracts/", "**/cache/", "**/out/"]

[workspace.dependencies]
async-trait = "0.1.81"
eyre = "0.6"
rand = "0.8.5"
serde = "1.0.204"
serde_json = "1.0.120"
tokio = { version = "1.38", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "process",
  "io-util",
] }
alloy = "2"
alloy-sol-types = "1.7"
litesvm = "0.18"
agave-feature-set = "4.3"
solana-sdk = "4"
spl-token = "8"
borsh = "1"
reqwest = "0.13"
# Official Sui Rust SDK — MystenLabs/sui-rust-sdk @ master 1313d51
# (2026-10-23, actively maintained; tags: sui-transaction-builder-0.4.0).
# Crate set: sui-rpc (gRPC client), sui-transaction-builder (PTB),
# sui-sdk-types (shared types).
sui-rpc = { git = "https://github.com/MystenLabs/sui-rust-sdk", rev = "1313d5112464ecc25d7407f42442adea08589fc5", features = [
  "unstable",
] }
sui-transaction-builder = { git = "https://github.com/MystenLabs/sui-rust-sdk", rev = "1313d5112464ecc25d7407f42442adea08589fc5", features = [
  "intents",
] }
sui-sdk-types = { git = "https://github.com/MystenLabs/sui-rust-sdk", rev = "1313d5112464ecc25d7407f42442adea08589fc5", features = [
  "unstable",
] }
bcs = "0.1"
sui-crypto = { git = "https://github.com/MystenLabs/sui-rust-sdk", rev = "1313d5112464ecc25d7407f42442adea08589fc5", features = [
  "ed25519",
] }
# move-binary-format (Mysten workspace member at the framework rev;
# serializer is behind the fuzzing feature)
move-binary-format = { git = "https://github.com/MystenLabs/sui.git", rev = "987123842623d6cb0e772dc665789cfd69bdec9f", features = [
  "fuzzing",
] }
move-core-types = { git = "https://github.com/MystenLabs/sui.git", rev = "987123842623d6cb0e772dc665789cfd69bdec9f" }
base64 = "0.22"
ed25519-consensus = "2"
blake2 = "0.10"
