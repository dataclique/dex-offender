name: CI

on:
  push:
    branches:
      - master
      - 0xgleb/solutions
      - sojaleiss/solutions
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  nix-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Foreign-system drvPath evaluation builds eval-time derivations,
        # which hosted x86_64 runners cannot do; the macOS shell is
        # exercised by local development instead.
        system: [x86_64-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Evaluate development shell
        run: nix eval --impure --raw .#devShells.${{ matrix.system }}.default.drvPath

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # move-over-ctf's pinned tree contains a dangling nested gitlink
      # (openzeppelin-ui with no URL), so recursive checkout fails; the
      # EVM-relevant submodules are initialized explicitly below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize EVM submodules
        # hana's canonical LFS objects are gone (404 server-side); the EVM
        # build never needs them, so LFS smudging is skipped for pointers.
        run: |
          git submodule update --init --recursive \
            lib/forge-std \
            lib/ethernaut \
            lib/damn-vulnerable-defi \
            lib/paradigm-ctf-2021 \
            lib/paradigm-ctf-2022 \
            lib/paradigm-ctf-2023
        env:
          GIT_LFS_SKIP_SMUDGE: '1'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Build attack helper contracts
        run: forge build

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Build upstream challenge contracts in place
        # forge comes from foundry-toolchain; the Linux dev shell cannot
        # build the foundry.nix package, so only nushell comes from nixpkgs.
        run: nix --accept-flake-config run nixpkgs#nushell -- scripts/build-contracts.nu

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Build crates
        run: cargo build --workspace --all-targets --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run the level runner on the saved deployment
        shell: bash
        run: |
          cargo run -p ctf --bin deploy_levels --locked
          anvil --load-state state.json --code-size-limit 50000 --quiet &
          anvil_pid=$!
          trap 'kill "$anvil_pid"; wait "$anvil_pid" || true' EXIT
          for attempt in {1..50}; do
            if cast block-number --rpc-url http://127.0.0.1:8545; then
              break
            fi
            sleep 0.1
          done
          cast block-number --rpc-url http://127.0.0.1:8545
          cargo run --locked
