name: CI

on:
  push:
    branches:
      - master
      - 0xgleb/solutions
      - sojaleiss/solutions
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  nix-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        system: [aarch64-darwin, aarch64-linux, x86_64-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Evaluate development shell
        run: nix eval --impure --raw .#devShells.${{ matrix.system }}.default.drvPath
      - name: Start native development shell
        if: matrix.system == 'x86_64-linux'
        run: nix develop --impure --command cargo --version

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Build crates
        run: cargo build --workspace --all-targets --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run the level runner on the saved deployment
        shell: bash
        run: |
          cargo run -p ctf --bin deploy_levels --locked
          anvil --load-state state.json --code-size-limit 50000 --quiet &
          anvil_pid=$!
          trap 'kill "$anvil_pid"; wait "$anvil_pid" || true' EXIT
          for attempt in {1..50}; do
            if cast block-number --rpc-url http://127.0.0.1:8545; then
              break
            fi
            sleep 0.1
          done
          cast block-number --rpc-url http://127.0.0.1:8545
          cargo run --locked
