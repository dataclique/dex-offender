name: CI

on:
  push:
    branches:
      - master
      - 0xgleb/solutions
      - sojaleiss/solutions
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  nix-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Foreign-system drvPath evaluation builds eval-time derivations,
        # which hosted x86_64 runners cannot do; the macOS shell is
        # exercised by local development instead.
        system: [x86_64-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Evaluate development shell
        run: nix eval --impure --raw .#devShells.${{ matrix.system }}.default.drvPath

  ci:
    runs-on: ubuntu-latest
    # foundry builds from source on Linux inside the flake shell, which
    # is slower than a prebuilt toolchain download.
    timeout-minutes: 60
    steps:
      # move-over-ctf's pinned tree contains a dangling nested gitlink
      # (openzeppelin-ui with no URL), so recursive checkout fails; the
      # EVM-relevant submodules are initialized explicitly below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize submodules
        # hana's canonical LFS objects are gone (404 server-side); the EVM
        # build never needs them, so LFS smudging is skipped for pointers.
        # solana-auditors-bootcamp ships the prebuilt .so and IDL the cpi
        # crate compiles against.
        run: |
          git submodule update --init --recursive \
            lib/forge-std \
            lib/ethernaut \
            lib/damn-vulnerable-defi \
            lib/paradigm-ctf-2021 \
            lib/paradigm-ctf-2022 \
            lib/paradigm-ctf-2023 \
            lib/solana-auditors-bootcamp
        env:
          GIT_LFS_SKIP_SMUDGE: '1'

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      # Everything below runs inside the flake shell: the same locked
      # nixpkgs, fenix toolchain, and foundry build that drive local
      # development — no toolchain actions, no registry refs, no version
      # divergence.
      - name: Check Solidity formatting
        run: nix --accept-flake-config develop --impure -L -c forge fmt --check

      - name: Build attack helper contracts
        run: nix --accept-flake-config develop --impure -c forge build

      - name: Build upstream challenge contracts in place
        run: nix --accept-flake-config develop --impure -c nu scripts/build-contracts.nu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Build crates
        run: nix --accept-flake-config develop --impure -c cargo build --workspace --all-targets --locked

      - name: Lint
        run: nix --accept-flake-config develop --impure -c cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify level deployment on both chains
        # Ethereum: deploy_levels spins its own owned, port-reserved
        # Anvil. Solana: the isolated Surfpool fixture
        # (ctf/tests/solana_localnet.rs) reserves a free port, spawns its
        # own instance, health-gates it, deploys every level, and asserts
        # unsolved-on-fresh plus idempotent redeployment. The runner CLI
        # is smoke-checked; its track selection is covered by unit
        # tests. Chain state stays out of the tree entirely.
        shell: bash
        run: |
          nix --accept-flake-config develop --impure -c cargo run -p ctf --bin deploy_levels --locked -- ethereum
          nix --accept-flake-config develop --impure -c cargo test -p ctf --test solana_localnet --locked -- --ignored --nocapture
          nix --accept-flake-config develop --impure -c cargo run --locked -- --help
