[profile.default]
libs = ['lib']
src = 'attack/contracts'
test = 'attack/test'
out = 'attack/out'
cache_path = 'attack/cache'

# Pinned upstream test sources compiled for harness-planted artifacts.
remappings = [
  "@v2p-test/=lib/damn-vulnerable-defi/lib/v2-periphery/contracts/test/",
]

optimizer = true
optimizer_runs = 9999
ignored_error_codes = [2072, 1878, 2018, 2394, 5159, 6321, 9302]

# Attack contracts are exploit scratchpads; forge's lints are noise there
# (locked ether and unchecked transfers are frequently the point).
[lint]
ignore = ["attack/contracts/**"]
exclude_lints = ["boolean-cst", "uninitialized-state", "unused-return"]
