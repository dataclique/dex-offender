[profile.default]
libs = ['lib']
src = 'attack/contracts'
test = 'attack/test'
out = 'attack/out'
cache_path = 'attack/cache'

optimizer = true
optimizer_runs = 9999
ignored_error_codes = [2072, 5159, 9302, 6321]

# Attack contracts are exploit scratchpads; forge's style lints are noise
# there. Keep the solidity compiler quiet about unnamed returns too.
[lint]
exclude_lints = ["boolean-cst", "uninitialized-state", "unused-return"]
