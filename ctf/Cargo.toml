[lints]
workspace = true

[package]
name = "ctf"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Experimental localnet work is opt-in; EVM practice needs no Move artifacts.
sui = [
  "dep:sui-rpc",
  "dep:sui-transaction-builder",
  "dep:sui-sdk-types",
  "dep:bcs",
  "dep:sui-crypto",
  "dep:move-binary-format",
  "dep:move-core-types",
  "dep:base64",
  "dep:ed25519-consensus",
  "dep:blake2",
]

[dependencies]
agave-feature-set.workspace = true
alloy.workspace = true
async-trait.workspace = true
base64 = { workspace = true, optional = true }
bcs = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
ackee-level-1-cpi = { path = "../cpi/ackee-level-1" }
borsh.workspace = true
ed25519-consensus = { workspace = true, optional = true }
eyre.workspace = true
hex.workspace = true
litesvm.workspace = true
move-binary-format = { workspace = true, optional = true }
move-core-types = { workspace = true, optional = true }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
solana-account = "4"
solana-address = "2.7"
solana-commitment-config.workspace = true
solana-rpc-client.workspace = true
solana-rpc-client-api.workspace = true
solana-sdk.workspace = true
solana-system-interface = "3.3"
spl-token.workspace = true
spl-token-2022-interface = "3"
sui-crypto = { workspace = true, optional = true }
sui-rpc = { workspace = true, optional = true }
sui-sdk-types = { workspace = true, optional = true }
sui-transaction-builder = { workspace = true, optional = true }
tokio.workspace = true
