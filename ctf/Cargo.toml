[lints]
workspace = true

[package]
name = "ctf"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# 2021/2022 Setups are compiled from per-challenge pinned sources; the
# sol! bindings live behind this feature until those build units land.
paradigm-legacy = []
# Experimental localnet work is opt-in; EVM practice needs no Move artifacts.
sui = [
  "dep:sui-rpc",
  "dep:sui-transaction-builder",
  "dep:sui-sdk-types",
  "dep:bcs",
  "dep:sui-crypto",
  "dep:move-binary-format",
  "dep:move-core-types",
  "dep:base64",
  "dep:ed25519-consensus",
  "dep:blake2",
]

[dependencies]
eyre.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
alloy.workspace = true
litesvm.workspace = true
agave-feature-set.workspace = true
solana-sdk.workspace = true
solana-account = "4"
solana-address = "2.7"
spl-token-2022-interface = "3"
solana-system-interface = "3.3"
spl-token.workspace = true
borsh.workspace = true
sui-rpc = { workspace = true, optional = true }
sui-transaction-builder = { workspace = true, optional = true }
sui-sdk-types = { workspace = true, optional = true }
bcs = { workspace = true, optional = true }
sui-crypto = { workspace = true, optional = true }
move-binary-format = { workspace = true, optional = true }
move-core-types = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ed25519-consensus = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
